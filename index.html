      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('berry-theme');
          var theme = saved === 'dark' || saved === 'light' ? saved : 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F4EF] text-[#141618] dark:bg-[#121417] dark:text-[#F3F0E9] antialiased selection:bg-[#9E4B28]/25 selection:text-[#141618] dark:selection:bg-[#EC743C]/30 dark:selection:text-[#F3F0E9]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
